<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Fredoka;font-weight:700;src:url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:600;src:url(../node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2)}</style></head>
<body><script type="module">
// Compone la foto de perfil y el banner de COPITO TV sobre los renders 3D
const load = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
await document.fonts.load('700 40px Fredoka'); await document.fonts.load('600 40px Fredoka');
const INK = '#2a1a6e', YEL = '#ffd84d', RED = '#ff2d4a', BLUE = '#2f7de1';
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function star(c, cx, cy, r, fill) { c.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .48 : r; const a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } c.closePath(); c.fillStyle = fill; c.lineJoin = 'round'; c.lineWidth = r * .22; c.strokeStyle = INK; c.stroke(); c.fill(); }
function outlined(c, txt, x, y, size, fill, stroke = INK, sw = .16, weight = 700) {
  c.font = `${weight} ${size}px Fredoka`; c.lineJoin = 'round';
  c.lineWidth = size * sw * 1.6; c.strokeStyle = 'rgba(20,10,60,.35)'; c.strokeText(txt, x, y + size * .06);
  c.lineWidth = size * sw; c.strokeStyle = stroke; c.strokeText(txt, x, y); c.fillStyle = fill; c.fillText(txt, x, y);
}
function logo(c, cx, cy, size) {
  // "COPITO" + placa amarilla "TV"
  c.textBaseline = 'middle'; c.textAlign = 'left';
  c.font = `700 ${size}px Fredoka`; const w1 = c.measureText('COPITO').width;
  c.font = `700 ${size * .62}px Fredoka`; const w2 = c.measureText('TV').width;
  const pad = size * .2, gap = size * .14, bw = w2 + pad * 2, bh = size * .78;
  const total = w1 + gap + bw; let x = cx - total / 2;
  outlined(c, 'COPITO', x, cy, size, '#ffffff');
  const bx = x + w1 + gap, by = cy - bh / 2;
  c.save(); c.translate(bx + bw / 2, cy); c.rotate(-.06); c.translate(-(bx + bw / 2), -cy);
  rrect(c, bx, by + size * .05, bw, bh, bh * .28); c.fillStyle = 'rgba(20,10,60,.35)'; c.fill();
  rrect(c, bx, by, bw, bh, bh * .28); c.fillStyle = YEL; c.fill(); c.lineWidth = size * .07; c.strokeStyle = INK; c.stroke();
  c.font = `700 ${size * .62}px Fredoka`; c.fillStyle = INK; c.textAlign = 'center'; c.fillText('TV', bx + bw / 2, cy + size * .03);
  c.restore();
  return { left: x, right: x + total };
}
function bell(c, cx, cy, s) {
  c.save(); c.translate(cx, cy); c.scale(s, s); c.fillStyle = '#fff';
  c.beginPath(); c.moveTo(-.38, .28); c.quadraticCurveTo(-.3, .18, -.3, -.05); c.quadraticCurveTo(-.3, -.42, 0, -.45); c.quadraticCurveTo(.3, -.42, .3, -.05); c.quadraticCurveTo(.3, .18, .38, .28); c.closePath(); c.fill();
  c.beginPath(); c.arc(0, .36, .1, 0, Math.PI * 2); c.fill(); c.beginPath(); c.arc(0, -.5, .07, 0, Math.PI * 2); c.fill(); c.restore();
}
async function avatar() {
  const img = await load('raw/avatar.png'); const S = 800;
  const cv = document.createElement('canvas'); cv.width = cv.height = S; const c = cv.getContext('2d');
  c.imageSmoothingQuality = 'high'; c.drawImage(img, 0, 0, S, S);
  // viñeta suave para centrar la atención en el círculo
  const g = c.createRadialGradient(S / 2, S / 2, S * .3, S / 2, S / 2, S * .56); g.addColorStop(0, 'rgba(40,20,90,0)'); g.addColorStop(1, 'rgba(40,20,90,.45)'); c.fillStyle = g; c.fillRect(0, 0, S, S);
  // placa con el nombre (dentro del recorte circular)
  const pw = 520, ph = 118, px = (S - pw) / 2, py = 598;
  rrect(c, px, py + 8, pw, ph, ph / 2); c.fillStyle = 'rgba(20,10,60,.35)'; c.fill();
  rrect(c, px, py, pw, ph, ph / 2); c.fillStyle = BLUE; c.fill(); c.lineWidth = 9; c.strokeStyle = '#fff'; c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  logo(c, S / 2, py + ph / 2 + 2, 70);
  star(c, 128, 210, 30, YEL); star(c, 676, 168, 22, YEL);
  return cv;
}
async function banner() {
  const img = await load('raw/banner.png'); const Wd = 2560, Ht = 1440;
  const cv = document.createElement('canvas'); cv.width = Wd; cv.height = Ht; const c = cv.getContext('2d');
  c.drawImage(img, 0, 0, Wd, Ht);
  const cx = 1010; // centro del bloque de texto (dentro de la zona segura 507–2053)
  const glow = c.createRadialGradient(cx, 720, 50, cx, 720, 700); glow.addColorStop(0, 'rgba(255,240,255,.28)'); glow.addColorStop(1, 'rgba(255,240,255,0)'); c.fillStyle = glow; c.fillRect(0, 0, Wd, Ht);
  logo(c, cx, 640, 200);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  outlined(c, '¡Cuentos animados para soñar en grande!', cx, 778, 50, '#fff4b8', INK, .2, 600);
  // botón "SUSCRÍBETE"
  c.font = '600 40px Fredoka'; const campW = c.measureText('y activa la campanita').width;
  c.font = '700 48px Fredoka'; const label = 'SUSCRÍBETE'; const lw = c.measureText(label).width;
  const bw = lw + 160, bh = 88, bx = cx - (bw + 112 + campW) / 2, by = 832;
  rrect(c, bx, by + 7, bw, bh, bh / 2); c.fillStyle = 'rgba(20,10,60,.4)'; c.fill();
  rrect(c, bx, by, bw, bh, bh / 2); c.fillStyle = RED; c.fill(); c.lineWidth = 7; c.strokeStyle = '#fff'; c.stroke();
  // icono de reproducir
  c.fillStyle = '#fff'; rrect(c, bx + 34, by + 24, 62, 44, 12); c.fill();
  c.fillStyle = RED; c.beginPath(); c.moveTo(bx + 57, by + 34); c.lineTo(bx + 57, by + 58); c.lineTo(bx + 78, by + 46); c.closePath(); c.fill();
  c.font = '700 48px Fredoka'; c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(label, bx + 118, by + bh / 2 + 2);
  // "y activa la campanita"
  const tx = bx + bw + 40; bell(c, tx + 30, by + bh / 2, 62);
  c.textAlign = 'left'; outlined(c, 'y activa la campanita', tx + 72, by + bh / 2 + 2, 40, '#ffffff', INK, .2, 600);
  for (const [x, y, r] of [[545, 560, 24], [1500, 545, 18]]) star(c, x, y, r, YEL);
  return cv;
}
window.OUT = { avatar: (await avatar()).toDataURL('image/png'), banner: (await banner()).toDataURL('image/jpeg', .93) };
</script></body></html>
